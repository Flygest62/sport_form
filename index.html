<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка | Спортивная комиссия ППО</title>
    <style>
        :root {
            --bg-dark: #0f143a;
            --card-bg: #182052;
            --gold: #e2b842;
            --gold-hover: #f3ca52;
            --text-main: #ffffff;
            --text-muted: #b0b8d8;
            --border: #2e3a7a;
            --input-bg: #101640;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        body {
            background: radial-gradient(circle at top, #1e2869 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 560px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--gold);
            box-shadow: 0 0 20px rgba(226, 184, 66, 0.3);
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 1.45rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--gold);
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .field-group { margin-bottom: 18px; }
        
        label {
            display: block;
            font-size: 0.92rem;
            font-weight: 600;
            margin-bottom: 7px;
            color: #e6e9f8;
        }

        .req { color: var(--gold); }

        input[type="text"], input[type="tel"], input[type="number"], select, textarea {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--gold);
        }

        textarea { resize: vertical; min-height: 80px; }

        /* Радио-кнопки в виде плашек (для размеров, курса и т.д.) */
        .chips-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip-label {
            cursor: pointer;
            padding: 9px 15px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            user-select: none;
        }

        .chip-input { display: none; }
        .chip-input:checked + .chip-label {
            background: var(--gold);
            color: #0f143a;
            border-color: var(--gold);
            font-weight: 700;
        }

        /* Чекбоксы */
        .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .checkbox-wrap input {
            width: 18px;
            height: 18px;
            accent-color: var(--gold);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(135deg, var(--gold) 0%, #c89b28 100%);
            color: #0f143a;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(226, 184, 66, 0.35);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .success-screen {
            display: none;
            text-align: center;
            padding: 30px 10px;
        }

        .success-screen h2 { color: var(--gold); margin-bottom: 10px; }
        .success-screen p { color: var(--text-muted); margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="logo.png" alt="Спортивная комиссия ППО" class="logo" onerror="this.style.display='none'">
        <h1 id="form-title">Заявка в Спортивную комиссию</h1>
        <p id="form-subtitle">Первичная профсоюзная организация</p>
    </div>

    <form id="dynamic-form">
        <div id="fields-container"></div>
        <button type="submit" class="btn-submit" id="submit-btn">Отправить заявку</button>
    </form>

    <div class="success-screen" id="success-screen">
        <h2>✅ Заявка принята!</h2>
        <p>Данные успешно переданы в Спортивную комиссию ППО.</p>
        <button class="btn-submit" onclick="location.reload()">Отправить ещё одну</button>
    </div>
</div>

<script>
    // ==========================================
    // КОНФИГУРАЦИЯ ФОРМЫ (МЕНЯЙ ПОЛЯ ЗДЕСЬ)
    // ==========================================
    const CONFIG = {
        apiUrl: "http://104.143.218.8:8000/api/submit", // Укажи свой IP/домен с FastAPI
        formName: "Заявка на экипировку / мероприятие",
        title: "Заявка на спортивную форму",
        subtitle: "Спортивная комиссия ППО • Заполните данные ниже"
    };

    // Типы полей: text, tel, number, select, chips, checkbox, textarea
    const FORM_FIELDS = [
        { id: "fio", label: "ФИО полностью", type: "text", placeholder: "Магомедов Испай Магомедович", required: true },
        { id: "faculty", label: "Факультет / Институт", type: "select", required: true, options: [
            "Инженерно-технологический", "Экономический", "Юридический", "Физико-математический", "Другой"
        ]},
        { id: "course_group", label: "Курс и группа", type: "text", placeholder: "2 курс, 204 группа", required: true },
        { id: "sport", label: "Вид спорта / Секция", type: "select", required: true, options: [
            "Волейбол", "Футбол", "Баскетбол", "Настольный теннис", "Лёгкая атлетика", "Киберспорт"
        ]},
        { id: "size", label: "Размер формы", type: "chips", required: true, options: ["XS", "S", "M", "L", "XL", "2XL", "3XL"] },
        { id: "jersey_name", label: "Фамилия и номер на форму", type: "text", placeholder: "МАГОМЕДОВ — № 7", required: false },
        { id: "phone", label: "Номер телефона", type: "tel", placeholder: "+7 (999) 000-00-00", required: true },
        { id: "telegram", label: "Ник в Telegram", type: "text", placeholder: "@username", required: true },
        { id: "profsoyuz", label: "Являюсь членом профсоюза (ППО)", type: "checkbox", required: true },
        { id: "comment", label: "Дополнительный комментарий", type: "textarea", placeholder: "Пожелания или примечания...", required: false }
    ];

    // ==========================================
    // ЛОГИКА ГЕНЕРАЦИИ И ОТПРАВКИ
    // ==========================================
    document.getElementById("form-title").textContent = CONFIG.title;
    document.getElementById("form-subtitle").textContent = CONFIG.subtitle;

    const container = document.getElementById("fields-container");

    FORM_FIELDS.forEach(field => {
        const group = document.createElement("div");
        group.className = "field-group";

        if (field.type === "checkbox") {
            group.innerHTML = `
                <label class="checkbox-wrap">
                    <input type="checkbox" name="${field.id}" ${field.required ? "required" : ""}>
                    <span>${field.label} ${field.required ? '<span class="req">*</span>' : ''}</span>
                </label>
            `;
            container.appendChild(group);
            return;
        }

        const label = document.createElement("label");
        label.innerHTML = `${field.label} ${field.required ? '<span class="req">*</span>' : ''}`;
        group.appendChild(label);

        if (field.type === "select") {
            const select = document.createElement("select");
            select.name = field.id;
            if (field.required) select.required = true;
            select.innerHTML = `<option value="" disabled selected>Выберите из списка...</option>` +
                field.options.map(opt => `<option value="${opt}">${opt}</option>`).join("");
            group.appendChild(select);
        } 
        else if (field.type === "chips") {
            const chipsDiv = document.createElement("div");
            chipsDiv.className = "chips-group";
            field.options.forEach((opt, idx) => {
                const uid = `${field.id}_${idx}`;
                chipsDiv.innerHTML += `
                    <div>
                        <input type="radio" id="${uid}" name="${field.id}" value="${opt}" class="chip-input" ${field.required && idx === 0 ? "required" : ""}>
                        <label for="${uid}" class="chip-label">${opt}</label>
                    </div>
                `;
            });
            group.appendChild(chipsDiv);
        } 
        else if (field.type === "textarea") {
            const ta = document.createElement("textarea");
            ta.name = field.id;
            ta.placeholder = field.placeholder || "";
            if (field.required) ta.required = true;
            group.appendChild(ta);
        } 
        else {
            const input = document.createElement("input");
            input.type = field.type;
            input.name = field.id;
            input.placeholder = field.placeholder || "";
            if (field.required) input.required = true;
            group.appendChild(input);
        }

        container.appendChild(group);
    });

    document.getElementById("dynamic-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("submit-btn");
        btn.disabled = true;
        btn.textContent = "Отправка...";

        const formData = new FormData(e.target);
        const answers = [];

        FORM_FIELDS.forEach(field => {
            let val = formData.get(field.id);
            if (field.type === "checkbox") val = val ? "Да" : "Нет";
            answers.push({ label: field.label, value: val || "—" });
        });

        try {
            const res = await fetch(CONFIG.apiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    form_name: CONFIG.formName,
                    answers: answers
                })
            });

            if (!res.ok) throw new Error("Ошибка сервера");

            document.getElementById("dynamic-form").style.display = "none";
            document.getElementById("success-screen").style.display = "block";
        } catch (err) {
            alert("Не удалось отправить заявку. Проверьте соединение или настройки сервера.");
            btn.disabled = false;
            btn.textContent = "Отправить заявку";
        }
    });
</script>
</body>
</html>
